# The safety net. Every 15 minutes: if a cluster exists and its expires-at tag
# has passed (or it has no tag at all), destroy it.
#
# Worst case with a 150-minute TTL is about 165 minutes of runtime. GitHub
# can delay or skip scheduled runs under load, and disables schedules after
# 60 days without repository activity -- so the AWS Budget alert (persistent
# stack) is the backstop behind this backstop.
name: cluster-reaper

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      expired: ${{ steps.check.outputs.expired }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::612529366989:role/privatepaste-gha-deploy
          aws-region: us-east-1

      - name: Check expiry
        id: check
        run: |
          if ! aws eks describe-cluster --name privatepaste > cluster.json 2>/dev/null; then
            echo "no cluster"; echo "expired=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          expires=$(jq -r '.cluster.tags["expires-at"] // empty' cluster.json)
          now=$(date -u +%s)
          # Fail safe: a cluster with a missing or unparseable tag is treated
          # as expired. A cluster nobody can account for is the expensive kind.
          exp=$(date -u -d "$expires" +%s 2>/dev/null || echo 0)
          echo "expires-at: ${expires:-<none>}, now: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$now" -ge "$exp" ]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "### Cluster expired (${expires:-no tag}); destroying" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
            echo "$(( (exp - now) / 60 )) minutes remaining"
          fi

  destroy:
    needs: check
    if: needs.check.outputs.expired == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cluster-down.yml
