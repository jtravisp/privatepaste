# CI/CD for the app. Scanning policy: docs/architecture.md section 15.3.
#
#   gitleaks --+
#   iac      --+--> image --> cluster-check --> deploy
#   test     --+    (build, scan, push)    (main only, and only if a cluster is up)
#
# Every run, PR or main:
#   - gitleaks: secrets anywhere in the git history
#   - iac:      Checkov on Terraform, the Dockerfile, these workflows and the
#               rendered EKS manifests
#   - test:     go vet, go test, govulncheck (reachable vulnerabilities)
#   - image:    build into the runner's local Docker, then Trivy: a full report
#               in the job summary, and a gate on fixable HIGH/CRITICAL CVEs
#
# On main only, if every gate passed: push the same image that was scanned
# (never rebuilt) to GHCR, tagged sha-<commit> and main; sign its digest with
# cosign (keyless, as this workflow's GitHub identity) and verify the
# signature; then deploy it if a cluster happens to be running. A PR's image
# is scanned and discarded.
#
# Scanner versions are pinned; downloaded binaries are checked against
# SHA-256 hashes written here, so changing a tool takes a commit.
#
# Building needs no AWS access: GHCR authenticates with the workflow's own
# GITHUB_TOKEN.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs, but never a run on main, which may be halfway
# through a push or a deploy: PRs share one group per branch, while each main
# run gets its own group (its run_id), so nothing can cancel it. Deploys still
# take turns via the eks-deploy group in deploy.yml.
#
# Written this way, not `cancel-in-progress: ${{ ... }}`: Checkov's schema only
# accepts a boolean there and silently skips the whole file otherwise.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, not just the latest commit

      # The hash is the project's published one, cross-checked against a local
      # download when the pin was set. It lives here, not in a checksums file
      # from the same release, so a replaced release asset fails this step.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        working-directory: ${{ runner.temp }}
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" gitleaks
          sudo mv gitleaks /usr/local/bin/

      # --redact: CI logs on a public repo are public; never print a finding.
      - name: Gitleaks
        run: gitleaks git --redact --verbose .

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version that produced the clean baseline, so a new
      # release's new checks can't fail builds unannounced. (Its Python
      # dependencies are not pinned; accepted.)
      - name: Install Checkov
        run: pipx install checkov==3.4.0

      # Not the kubernetes framework here: the kustomize bases and patches are
      # fragments, not complete manifests. The next step scans what ships.
      - name: Checkov (Terraform, Dockerfile, workflows)
        run: checkov -d . --framework terraform,dockerfile,github_actions --compact

      - name: Checkov (rendered EKS manifests)
        run: |
          kubectl kustomize deploy/k8s/overlays/eks > "$RUNNER_TEMP/eks-rendered.yaml"
          checkov -f "$RUNNER_TEMP/eks-rendered.yaml" --framework kubernetes --compact

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      # Installs the Go version in go.mod, so govulncheck checks the same
      # standard library the image ships.
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      # Fails only on vulnerabilities the code actually reaches.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  image:
    needs: [gitleaks, iac, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image and its signature to ghcr.io/<owner>/<repo>
      id-token: write # request a GitHub OIDC token: the identity Fulcio certifies for keyless signing
    outputs:
      # The full reference, ghcr.io/<owner>/<repo>@sha256:..., for deploying
      # by digest. Empty on PRs, which push nothing.
      image_ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build once, into the runner's local Docker. The push at the end sends
      # these exact bytes; nothing is rebuilt after the scan.
      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same pinning as Gitleaks. Trivy's own release was compromised in March
      # 2026; a hash in this file turns a swapped binary into a failed step.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        working-directory: ${{ runner.temp }}
        run: |
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${file}"
          echo "${TRIVY_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" trivy
          sudo mv trivy /usr/local/bin/

      # Report first, so the full picture is on the run page even when the
      # gate below fails. All severities, unfixed included; never fails.
      - name: Trivy report (informational)
        run: |
          {
            echo "### Trivy report"
            echo '```text'
            trivy image --exit-code 0 "$IMAGE:sha-$GITHUB_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --scanners vuln: only CVEs gate here; secrets are Gitleaks' job
      # (one scanner per question, section 15.3). The report above still
      # runs Trivy's default scanners, for information.
      - name: Trivy gate (fixable HIGH/CRITICAL)
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:sha-$GITHUB_SHA"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes both tags of the image scanned above. Both point to one digest,
      # so the single signature below covers both.
      - name: Push to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push --all-tags "$IMAGE"

      # The registry's digest of what was just pushed, as a full reference.
      # Signing and deploying use this, never a tag: a tag can be moved (even
      # by another run in the seconds before signing), a digest can't.
      - name: Get image reference
        id: ref
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          case "$ref" in
            "$IMAGE@sha256:"*) ;;
            *) echo "::error::unexpected image reference: $ref"; exit 1 ;;
          esac
          echo "Pushed: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Same pinning as the scanners.
      - name: Install cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_VERSION: 3.1.4
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        working-directory: ${{ runner.temp }}
        run: |
          file="cosign-linux-amd64"
          curl -sSfLO "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/${file}"
          echo "${COSIGN_SHA256}  ${file}" | sha256sum -c -
          chmod +x "$file"
          sudo mv "$file" /usr/local/bin/cosign

      # Keyless: cosign makes a throwaway key pair, trades this job's OIDC
      # token for a 10-minute Fulcio certificate naming this workflow, signs
      # the digest, records it in the public Rekor log, and stores the
      # signature in GHCR next to the image. --yes accepts the prompt about
      # publishing to Rekor, which would otherwise block in CI.
      #
      # If this fails, the image is already pushed but unsigned; the job fails,
      # so nothing deploys it, and signature verification would reject it.
      - name: Sign image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: cosign sign --yes "$IMAGE_REF"

      # Check the signature the way any consumer will. The identity is written
      # out in full, not built from this run's context: a verification policy
      # is fixed in advance, so a workflow on another branch, or another
      # workflow file, can't produce a signature that passes.
      - name: Verify signature
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/jtravisp/privatepaste/.github/workflows/build.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REF" > /dev/null
          echo "Signature verified for $IMAGE_REF"

  # Continuous deployment, but only when there is somewhere to deploy to.
  cluster-check:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      running: ${{ steps.status.outputs.running }}
    steps:
      # Deploying is optional here, so failing to reach AWS (for example,
      # before the persistent stack exists) means "no cluster", not a red build.
      - id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::612529366989:role/privatepaste-gha-deploy
          aws-region: us-east-1

      - id: status
        env:
          AWS_OK: ${{ steps.aws.outcome == 'success' }}
        run: |
          if [ "$AWS_OK" != true ]; then
            echo "could not assume the deploy role; skipping deploy"
            echo "running=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # "Running" means the cluster can take a deploy: the control plane
          # AND the node group are ACTIVE. The control plane is ACTIVE for
          # several minutes before any node exists (cluster-up mid-apply, or a
          # failed apply), and a deploy then can only time out on Pending pods.
          # cluster-up deploys itself once its nodes are ready.
          cluster=$(aws eks describe-cluster --name privatepaste --query cluster.status --output text 2>/dev/null || echo NONE)
          nodes=$(aws eks describe-nodegroup --cluster-name privatepaste --nodegroup-name default --query nodegroup.status --output text 2>/dev/null || echo NONE)
          echo "cluster status: $cluster, node group status: $nodes"
          echo "running=$([ "$cluster" = ACTIVE ] && [ "$nodes" = ACTIVE ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: cluster-check
    if: needs.cluster-check.outputs.running == 'true'
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      # Not $GITHUB_SHA: `with:` is never run through a shell.
      image_tag: sha-${{ github.sha }}
