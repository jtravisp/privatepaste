# Every pull request: vet, test and build the image (not pushed).
# Every push to main: the same, then push the image to GHCR tagged with the
# commit SHA, and -- if a cluster happens to be running -- deploy it.
#
# Building needs no AWS access at all: GHCR authenticates with the
# workflow's own GITHUB_TOKEN.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Vet
        run: go vet ./...

      # -race: the burn-after-read test fires concurrent readers; the race
      # detector would catch unsynchronized access in the handler or store.
      - name: Test
        run: go test -race -count=1 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/<repo>
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag per commit, so a deploy names exactly the code it runs and a
      # rollback is "deploy the previous SHA". `main` floats, for humans.
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          # Links the package to this repo on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous deployment, but only when there is somewhere to deploy to.
  cluster-check:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      running: ${{ steps.status.outputs.running }}
    steps:
      # Deploying is optional here, so failing to reach AWS (for example,
      # before the persistent stack exists) means "no cluster", not a red build.
      - id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::612529366989:role/privatepaste-gha-deploy
          aws-region: us-east-1

      - id: status
        env:
          AWS_OK: ${{ steps.aws.outcome == 'success' }}
        run: |
          if [ "$AWS_OK" != true ]; then
            echo "could not assume the deploy role; skipping deploy"
            echo "running=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          status=$(aws eks describe-cluster --name privatepaste --query cluster.status --output text 2>/dev/null || echo NONE)
          echo "cluster status: $status"
          echo "running=$([ "$status" = ACTIVE ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: cluster-check
    if: needs.cluster-check.outputs.running == 'true'
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: sha-${{ github.sha }}
