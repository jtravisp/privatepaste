# The pod's identity inside the cluster. On EKS, the Pod Identity association
# (infra/eks/access.tf) maps privatepaste/privatepaste to the IAM role that
# can use the DynamoDB table. Nothing here references AWS: the mapping lives
# on the AWS side, so this manifest is identical on kind.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: privatepaste
