apiVersion: apps/v1
kind: Deployment
metadata:
  name: privatepaste
  labels:
    app.kubernetes.io/name: privatepaste
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: privatepaste
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start a new pod and wait for it to be Ready before removing an old
      # one: a deploy never drops capacity below two.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: privatepaste
    spec:
      # Pod level: identity and syscall filtering apply to every container in
      # the pod, including any sidecar or `kubectl debug` container added later.
      securityContext:
        # The kubelet refuses to start a container that would run as UID 0.
        # It can only check a numeric user, which is why the Dockerfile says
        # `USER 65532:65532` and not `USER nonroot`.
        runAsNonRoot: true
        # Stated here as well as in the image, so a base-image change can't
        # silently change who the app runs as. Without runAsGroup the primary
        # group can fall back to 0 (root).
        runAsUser: 65532
        runAsGroup: 65532
        # The container runtime's default seccomp filter: blocks rarely used,
        # dangerous syscalls. Many clusters otherwise default to Unconfined.
        seccompProfile: {type: RuntimeDefault}
      # The app never calls the Kubernetes API, so don't mount an API token an
      # attacker could use. AWS access is unaffected: EKS Pod Identity injects
      # its own projected token (eks-pod-identity-token), not this one.
      automountServiceAccountToken: false
      # Still needed: the Pod Identity association binds the AWS role to this
      # ServiceAccount name (infra/eks).
      serviceAccountName: privatepaste
      # Must exceed the app's SHUTDOWN_DELAY plus its drain timeout, or the
      # kubelet SIGKILLs it mid-drain.
      terminationGracePeriodSeconds: 30
      # Prefer one replica per node, so losing a Spot node loses one pod, not
      # both. "ScheduleAnyway" keeps a single-node kind cluster working.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: privatepaste
      containers:
        - name: app
          # Container level: these fields don't exist at pod level.
          securityContext:
            # Sets no_new_privs: no setuid binary or file capability can give
            # the process more privilege than it started with.
            allowPrivilegeEscalation: false
            # Drop every Linux capability (NET_RAW, CHOWN, ...). Binding 8080
            # needs none; only ports below 1024 need NET_BIND_SERVICE.
            capabilities: {drop: ["ALL"]}
            # The app only reads its own filesystem, so an attacker can't drop
            # tools or modify files. If it ever needs scratch space, mount an
            # emptyDir at /tmp rather than relaxing this.
            readOnlyRootFilesystem: true
          # Placeholder; each overlay sets the real image with `images:`.
          image: privatepaste
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AWS_REGION
              value: us-east-1
            - name: SHUTDOWN_DELAY
              value: 5s
          # Readiness: "send me traffic". Fails if DynamoDB is unreachable or
          # the pod is shutting down; the pod is removed from the Service but
          # not restarted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          # Liveness: "restart me". Only checks the process answers HTTP, so a
          # DynamoDB outage does not become a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # Requests are what the scheduler reserves. The memory limit is a
            # ceiling against leaks. No CPU limit: CPU is compressible, and a
            # limit only adds throttling latency when the node has spare CPU.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
